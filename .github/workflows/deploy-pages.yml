name: Deploy NBD to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mode="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)"
          echo "GitHub Pages publishing mode: $mode"
          if [[ "$mode" != "workflow" ]]; then
            echo "::error title=Incorrect GitHub Pages source::Settings > Pages > Build and deployment > Source must be GitHub Actions, not Deploy from a branch."
            echo "Fix here: https://github.com/$GITHUB_REPOSITORY/settings/pages"
            exit 1
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build static website
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_NBD_CONTACT_EMAIL: ${{ vars.NBD_CONTACT_EMAIL }}
      - name: Validate static export
        run: npm run test:static
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout for live smoke checks
        uses: actions/checkout@v4
      - name: Set up Node.js for smoke checks
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live website after deploy
        run: node scripts/check-live.mjs
