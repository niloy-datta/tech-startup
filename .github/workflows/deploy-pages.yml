name: Deploy Kadhavira Labs to GitHub Pages

# This repository uses GitHub Pages' "Deploy from a branch" setting.
# Pages publishes main / (root). Export Next.js and commit the generated site
# alongside the source files so no GitHub Pages administration token is needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kadhavira-static-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build static website for GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_KADHAVIRA_CONTACT_EMAIL: ${{ vars.KADHAVIRA_CONTACT_EMAIL || vars.NBD_CONTACT_EMAIL }}
      - name: Validate exported website
        run: npm run test:static
      - name: Publish static export to Pages source root
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/services/index.html
          test -f out/work/index.html
          test -f out/labs/index.html
          test -d out/_next
          # Keep Next.js source files and its assets together in the existing
          # main-branch root. GitHub Pages reads this root directly.
          cp -a out/. ./
          # Disable Jekyll: otherwise it drops the required _next assets.
          touch .nojekyll

          git add -f -- .nojekyll
          # Stage only files produced by the static export, not source changes
          # or npm-generated files. This also works for generated nested paths.
          while IFS= read -r -d '' artifact; do
            path="${artifact#out/}"
            git add -f -- "$path"
          done < <(find out -type f -print0)

          if git diff --cached --quiet; then
            echo "Static export already matches the published source root."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "deploy(pages): publish Kadhavira Labs static site"
          git push origin HEAD:main
          echo "Static website files are now committed to main / (root)."
