name: Verify Kadhavira Labs GitHub Pages Live Site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Kadhavira Labs pages on GitHub Pages
        run: node scripts/check-live.mjs
        env:
          KADHAVIRA_SITE_URL: 'https://niloy-datta.github.io/tech-startup/'
          KADHAVIRA_LIVE_ATTEMPTS: '18'
          KADHAVIRA_LIVE_RETRY_MS: '5000'
